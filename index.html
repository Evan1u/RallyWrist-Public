<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="RallyWrist，Apple Watch 羽毛球计分。计分、双打轮转、运动记录。">
  <title>RallyWrist — 每一分，都在腕上。</title>
  <link rel="icon" href="assets/rallywrist-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="nav wrap">
  <a class="brand" href="#top" aria-label="RallyWrist 首页">Rally<span>Wrist.</span></a>
  <nav aria-label="主导航"><a href="#scoring">计分</a><a href="#features">功能</a></nav>
</header>
<main id="top">
  <section class="hero">
    <div class="hero-stage wrap">
    <div class="hero-copy">
      <p class="eyebrow">Apple Watch 羽毛球计分</p>
      <h1><span class="hero-line">每一分，</span><br class="mobile-break"><span class="hero-line">都在腕上。</span></h1>
      <p class="lede">计分、双打轮转、运动记录。</p>
    </div>
    <div class="hero-product-motion">
    <figure class="hero-device">
      <div class="watch"><div class="screen">
        <video id="home-video" data-native-video autoplay muted loop playsinline preload="auto" poster="assets/latest/home.png" aria-label="RallyWrist 首页演示"><source src="assets/latest/home.mp4" type="video/mp4"></video>
      </div></div>
    </figure>
    </div>
    <div class="hero-playback"><button class="playback" data-video="home-video" aria-label="暂停首页演示">暂停</button></div>
    </div>
  </section>
  <section class="scoring wrap" id="scoring">
    <div class="scoring-panel">
    <div class="section-copy">
      <div class="score-chapters">
        <article class="score-chapter">
          <h2>一划，<br><span>记下一分。</span></h2>
          <p>上划加分，下划减分。</p>
        </article>
        <article class="score-chapter">
          <h2>双打站位，<br><span>自动跟上。</span></h2>
          <p>发球、接发，一眼清楚。</p>
        </article>
      </div>
      <div class="tabs" role="group" aria-label="选择计分演示">
        <button class="selected" data-demo="doubles" aria-pressed="true">双打</button>
        <button data-demo="singles" aria-pressed="false">单打</button>
      </div>
    </div>
    <figure class="score-device">
      <div class="watch"><div class="screen">
        <video id="score-video" data-native-video autoplay muted loop playsinline preload="metadata" poster="assets/latest/doubles-10.png" aria-label="双打计分演示"><source src="assets/latest/doubles.mp4" type="video/mp4"></video>
      </div></div>
      <figcaption><button class="playback" data-video="score-video" aria-label="暂停计分演示">暂停</button></figcaption>
    </figure>
    </div>
  </section>
  <section class="features" id="features" aria-label="更多功能">
    <div class="wrap">
    <h2 class="features-title">从开赛，<span>到赛后。</span></h2>
    <div class="gallery">
      <figure>
        <figcaption><h3>准备开赛。</h3><p>选好模式，设定目标。</p></figcaption>
        <div class="capture"><img src="assets/latest/setup.png" alt="比赛设置：单打、双打与目标分" width="422" height="514" loading="lazy"></div>
      </figure>
      <figure>
        <figcaption><h3>记录每一拍。</h3><p>时间、心率、活动能量。</p></figcaption>
        <div class="capture"><img src="assets/latest/metrics.png" alt="运动时间、心率与活动能量，数据为演示样例" width="422" height="514" loading="lazy"></div>
      </figure>
      <figure>
        <figcaption><h3>收好这一场。</h3><p>比分与运动，一起保存。</p></figcaption>
        <div class="capture"><img src="assets/latest/completion.png" alt="赛后回顾：局胜、每局比分与运动记录，数据为演示样例" width="422" height="514" loading="lazy"></div>
      </figure>
    </div>
    </div>
  </section>
</main>
<footer class="wrap"><span>RallyWrist.</span><span>For Apple Watch.</span></footer>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/ScrollTrigger.min.js"></script>
<script src="script.js"></script>
<script src="motion.js"></script>
</body>
</html>
